server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at the reverse proxy; keep redirects relative so they stay on https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Payload CMS: admin UI, its REST API (also serves uploaded media) and Next.js assets.
    location ~ ^/(admin|api|_next)(/|$) {
        client_max_body_size 50m;
        proxy_pass http://feri-informatika-web-cms:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }

    # Hashed build output never changes under the same name.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
