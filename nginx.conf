server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = / {
        try_files /feri-informatika-web/index.html /index.html =404;
    }

    location = /feri-informatika-web {
        return 301 /feri-informatika-web/;
    }

    location = /feri-informatika-web/research {
        return 301 /feri-informatika-web/research/group/;
    }

    location = /feri-informatika-web/research/ {
        return 301 /feri-informatika-web/research/group/;
    }

    location = /feri-informatika-web/studies {
        return 301 /feri-informatika-web/studies/programmes/;
    }

    location = /feri-informatika-web/studies/ {
        return 301 /feri-informatika-web/studies/programmes/;
    }

    location = /feri-informatika-web/en/research {
        return 301 /feri-informatika-web/en/research/projects/;
    }

    location = /feri-informatika-web/en/research/ {
        return 301 /feri-informatika-web/en/research/projects/;
    }

    location = /feri-informatika-web/en/studies {
        return 301 /feri-informatika-web/en/studies/programmes/;
    }

    location = /feri-informatika-web/en/studies/ {
        return 301 /feri-informatika-web/en/studies/programmes/;
    }

    location /feri-informatika-web/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
