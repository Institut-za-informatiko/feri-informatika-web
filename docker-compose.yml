services:
  feri-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feri-web
    ports:
      - "4321:80"
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

