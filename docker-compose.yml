services:
  web:
    image: ghcr.io/institut-za-informatiko/feri-informatika-web:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: feri-informatika-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: postgres://payload:${POSTGRES_PASSWORD}@cms-db:5432/payload
    # Lets the non-root Node process listen on port 80.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on:
      cms-db:
        condition: service_healthy
    volumes:
      - cms-media:/app/media
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # No published ports: Nginx Proxy Manager on bclabum reaches the container by name.
    networks:
      - nginx-proxy-internal
      - internal

  cms-db:
    image: postgres:17-alpine
    container_name: feri-informatika-web-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_DB: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - cms-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  cms-media:
  cms-db:

networks:
  nginx-proxy-internal:
    external: true
  internal:
