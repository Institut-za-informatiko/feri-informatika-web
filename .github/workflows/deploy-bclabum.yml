name: Deploy to bclabum

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by the CMS (cms/src/hooks/triggerRebuild.ts) when published content changes.
  repository_dispatch:
    types: [cms-publish]

permissions:
  contents: read
  packages: write

concurrency:
  group: bclabum-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/institut-za-informatiko/feri-informatika-web
  CMS_IMAGE: ghcr.io/institut-za-informatiko/feri-informatika-web-cms
  CMS_URL: https://ii-preview.bclabum.si

jobs:
  lint:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck CMS
        run: pnpm --filter cms typecheck

  # Content-only rebuilds (repository_dispatch) reuse the CMS image already running.
  cms-image:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CMS_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cms/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # The static site is built from the live CMS. PRs only build to prove it still works.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CMS_URL=${{ env.CMS_URL }}
            CONTENT_REVISION=${{ github.run_id }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [lint, cms-image, image]
    # Skipped jobs (lint/cms-image on content rebuilds) must not block the deploy.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ii-preview
      url: https://ii-preview.bclabum.si
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.BCLABUM_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BCLABUM_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMS_TAG: ${{ needs.cms-image.result == 'success' && format('sha-{0}', github.sha) || 'current' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted to deploy.sh on the server; the arguments are the image tags,
          # stdin carries this job's token for the GHCR pull.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key urban@157.180.6.182 "sha-${GITHUB_SHA} ${CMS_TAG}"

      - name: Smoke test
        run: |
          for path in / /about/ /en/ /healthz /admin/login /api/news?limit=1; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://ii-preview.bclabum.si${path}")
            echo "${code} ${path}"
            [ "$code" = 200 ] || exit 1
          done
